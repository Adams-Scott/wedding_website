*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

.ib{width:48px;height:48px;border:0;border-radius:50%;background:none;color:var(--onv);display:grid;place-items:center;cursor:pointer;position:relative}

.ib.on{color:var(--pri)}
.ib svg{width:24px;height:24px;fill:currentColor}
.ib .off{display:none}.ib:not(.on) .off{display:block}.ib:not(.on) .onn{display:none}
.sel{position:relative;margin:8px 8px 0 0}
.sel label{position:absolute;top:-9px;left:12px;padding:0 4px;background:var(--sc);font-size:12px;color:var(--pri);line-height:16px;z-index:1}
select{width:100%;height:56px;appearance:none;-webkit-appearance:none;border:1px solid var(--out);border-radius:4px;background:transparent;color:var(--on);font:inherit;padding:0 48px 0 16px;cursor:pointer}
select:focus{outline:2px solid var(--pri);border-color:var(--pri)}
select option,select optgroup{background:var(--bg);color:var(--on)}
.sel svg{position:absolute;right:12px;top:16px;width:24px;height:24px;fill:var(--onv);pointer-events:none}
main{max-width:560px;margin:0 auto;padding:16px 16px 32px}
.card{background:var(--sc);border-radius:16px;padding:8px 0;box-shadow:var(--sh)}
.sub{margin:0;padding:12px 20px 8px;font-size:14px;font-weight:500;color:var(--pri);letter-spacing:.1px}
ol{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 20px;font-size:17px;font-weight:500;letter-spacing:.3px}
li+li{border-top:1px solid color-mix(in srgb,var(--out) 30%,transparent)}
li i{flex:none;width:32px;height:32px;border-radius:50%;background:var(--pc);color:var(--onpc);display:grid;place-items:center;font:500 14px Roboto,system-ui,sans-serif}
</style>
</head>
